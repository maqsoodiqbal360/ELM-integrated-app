name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and initialize Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure Native Bluetooth SPP & Permissions
        run: |
          mkdir -p android/app/src/main/java/com/maqsood/cartechlog/obd2
          cp native/MainActivity.java android/app/src/main/java/com/maqsood/cartechlog/obd2/MainActivity.java
          python3 native/patch_manifest.py

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Car-Tech-Log-OBD2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
